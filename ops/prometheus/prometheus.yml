# Scrapes the app's private management port. Edit the target to wherever the API runs.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: vijay-mall
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9090"]   # the management port (MANAGEMENT_PORT), never the public 8080
