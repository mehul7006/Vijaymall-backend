# Alert rules for the shop's back end. Every rule says what a person should do, not just what is wrong.
groups:
  - name: vijay-mall
    rules:
      - alert: ApiDown
        expr: up{job="vijay-mall"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "The API is not answering"
          action: "Check the container/process and its logs; customers and the counter cannot order or bill."

      - alert: HighServerErrorRate
        expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count[5m])) > 0.02
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "More than 2% of requests are failing with a server error"
          action: "Open the logs, filter http.status>=500 and read the first error with its traceId."

      - alert: SlowApi
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/api/v1/(orders|admin/orders)/stream"}[5m]))) > 1
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "95% of requests take longer than 1 second"
          action: "Check database connections (HikariPending) and slow queries; see the performance notes in ops/README.md."

      - alert: SlowCounterBilling
        expr: histogram_quantile(0.95, sum by (le) (rate(mall_pos_sale_seconds_bucket[5m]))) > 0.8
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Ringing up a bill is slow (p95 over 0.8 s)"
          action: "The counter is waiting. Check the database first."

      - alert: RefundsFailed
        expr: mall_refunds_failed > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "A customer refund could not be sent after all tries"
          action: "Admin app > Refunds > Failed. Fix the cause (provider outage, keys), then Retry. Customers are waiting for money."

      - alert: RefundsStuck
        expr: mall_refunds_pending > 5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Refunds are piling up in the queue"
          action: "The payment provider may be down; the job retries every 30 seconds."

      - alert: OutboxBacklog
        expr: mall_outbox_pending > 100
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Notifications and alerts are not being delivered"
          action: "Check the logs for 'Outbox listener failed'. Order updates and low-stock alerts are delayed."

      - alert: DatabasePoolExhausted
        expr: hikaricp_connections_pending > 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "Requests are waiting for a database connection"
          action: "Look for slow queries or a stuck transaction; raise the pool size only after that."

      - alert: HeapAlmostFull
        expr: sum(jvm_memory_used_bytes{area="heap"}) / sum(jvm_memory_max_bytes{area="heap"}) > 0.9
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "The JVM heap is over 90% full"
          action: "Check for a memory leak; consider a restart and more memory."

      - alert: LoginRefusalsSpike
        expr: sum(rate(mall_rate_limited_total{scope=~"otp.*"}[10m])) > 0.5
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Many login-code requests are being refused (possible abuse)"
          action: "Check the access log for the client IPs hitting /auth/otp."

      - alert: ManyLowStockProducts
        expr: mall_stock_low_products > 25
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "More than 25 products are at or below their stock alert level"
          action: "Time to reorder: see the morning restocking notification in the admin app."

      - alert: NoSalesDuringShopHours
        expr: (sum(increase(mall_pos_sales_total[1h])) + sum(increase(mall_orders_placed_total[1h]))) == 0 and on() (hour() >= 4 and hour() < 16)
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "No bills or orders for an hour during opening hours"
          action: "Either the shop is quiet or the counter cannot reach the server: call the counter."

      - alert: FlashSaleRunningWithoutSales
        expr: max(mall_flash_sales{state="active"}) > 0 and on() sum(increase(mall_flash_units_sold_total[30m])) == 0
        for: 30m
        labels: {severity: info}
        annotations:
          summary: "A flash sale has been running for 30 minutes and nothing has sold at the sale price"
          action: "Open the sale's report (GET /api/v1/admin/flash-sales/{id}/report). Check the discount is attractive, the channel is right and the app shows the sale (GET /api/v1/flash-sales/active)."

      - alert: FlashSaleCheckoutsRefused
        expr: sum(increase(mall_flash_refused_total[10m])) > 20
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Many checkouts were turned away because a flash sale ended or ran out"
          action: "Customers are seeing a stale sale price. Check that the app refetches when the FLASH live event arrives, and the units left on the sale report."

      - alert: PaymentAnomaly
        expr: increase(mall_payments_anomalies_total[1h]) > 0
        labels: {severity: warning}
        annotations:
          summary: "A wrong-amount or duplicate online payment was received and is being refunded"
          action: "Open GET /api/v1/admin/payments/anomalies to see which orders, then check the refund monitor (GET /api/v1/admin/refunds) that the refunds reach ISSUED."

      - alert: OfflineBillExceptionsUnreviewed
        expr: mall_pos_offline_exceptions_stale > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Differences in offline counter bills have been waiting for a manager for more than a day"
          action: "Open the admin list (GET /api/v1/admin/pos/offline-exceptions?status=OPEN): changed prices, discounts nobody approved, stock sold that the system did not have. Look at each one and mark it reviewed."
