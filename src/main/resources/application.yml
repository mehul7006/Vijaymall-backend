spring:
  application:
    name: vijay-mall
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mall}
    username: ${DB_USER:mall}
    password: ${DB_PASSWORD:mall}
    # Database connection pool. Sized to the database, not to the traffic: PostgreSQL allows 100 connections by default and every
    # backend instance holds up to DB_POOL_MAX of them (instances x DB_POOL_MAX must stay under max_connections, with some left for admin tools).
    # Requests run on virtual threads, so many can wait for a connection cheaply; a small pool keeps the database from being overloaded.
    hikari:
      pool-name: mall-db
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Give up after 5 s with a clear error instead of hanging a request for the 30 s default.
      connection-timeout: ${DB_POOL_WAIT_MS:5000}
      validation-timeout: 3000
      # Retire connections before the database or a firewall drops them; idle ones are trimmed down to minimum-idle.
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1500000}
      idle-timeout: ${DB_POOL_IDLE_MS:600000}
      keepalive-time: 300000
      # 0 = off. Set e.g. 20000 while hunting a connection leak: logs the stack of code holding a connection longer than that.
      leak-detection-threshold: ${DB_POOL_LEAK_MS:0}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 32
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  threads:
    virtual:
      enabled: true
  task:
    # @Scheduled jobs (outbox relay, flash lifecycle, cleanups). Spring's default is ONE thread, so a slow job would delay all others.
    scheduling:
      thread-name-prefix: mall-sched-
      pool:
        size: ${SCHEDULER_THREADS:4}
      shutdown:
        await-termination: true
        await-termination-period: 20s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8080
  shutdown: graceful
  tomcat:
    max-swallow-size: 6MB
    # Requests run on virtual threads (spring.threads.virtual), so there is no request thread pool to size: max-threads is ignored.
    # What bounds the server is the DB pool above and these connection limits.
    max-connections: ${TOMCAT_MAX_CONNECTIONS:8192}
    # Connections queued when max-connections is reached; beyond that clients are refused quickly instead of piling up.
    accept-count: ${TOMCAT_ACCEPT_COUNT:200}
    connection-timeout: 20s
    keep-alive-timeout: 30s
    max-keep-alive-requests: 200
  # none: X-Forwarded-* is not believed (anyone can send it). Set FORWARD_HEADERS_STRATEGY=native behind a proxy that overwrites it.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"
  level:
    # Raise or lower at runtime with an environment variable, no rebuild: LOG_LEVEL_APP=DEBUG for the shop's own code.
    com.vijay.mall: ${LOG_LEVEL_APP:INFO}
    root: ${LOG_LEVEL_ROOT:INFO}

management:
  # Metrics and health live on their own port so they are never reachable through the public one: keep this port private
  # (firewall / Docker network) and let Prometheus scrape http://<host>:9090/actuator/prometheus.
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: vijay-mall
      env: ${APP_ENV:local}
    distribution:
      # Histograms let Grafana compute p50/p95/p99 across instances; the buckets are the latencies the shop cares about.
      percentiles-histogram:
        http.server.requests: true
        mall.order.place: true
        mall.pos.sale: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  health:
    # An unreachable mail server must not mark the whole app DOWN (load balancers would take it out of service).
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

app:
  config:
    # 32 random bytes, base64 (openssl rand -base64 32). Encrypts the secrets the admin saves in the config screen. Keep it in
    # the secret manager; if it is lost those secrets must be entered again.
    encryption-key: ${CONFIG_ENCRYPTION_KEY:}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-0123456789}
    access-ttl-seconds: 900
    refresh-ttl-days: 30
  otp:
    channel: ${OTP_CHANNEL:console}
    # How mobile (SMS) codes are delivered: console (log it, dev only) or none (mobile login answers 503).
    sms-channel: ${SMS_CHANNEL:none}
    pepper: ${OTP_PEPPER:dev-pepper}
    fixed-code: ${OTP_FIXED_CODE:}
    from: ${OTP_FROM:no-reply@vijaysupermall.example}
  pos:
    # A cashier can take returns only on bills this many days old (0 = no limit); admins are not limited.
    cashier-return-days: ${POS_CASHIER_RETURN_DAYS:7}
    # Manual discount a cashier may give without a manager's PIN, as a percent of the bill (0 = every manual discount needs the PIN).
    cashier-discount-percent: ${POS_CASHIER_DISCOUNT_PERCENT:0}
    # true = billing needs an open cashier shift (drawer counted in).
    require-open-shift: ${POS_REQUIRE_OPEN_SHIFT:false}
  notifications:
    # Most admin broadcasts one admin may create per hour (429 RATE_LIMITED after that).
    broadcast-per-hour: ${BROADCAST_PER_HOUR:20}
  rate-limit:
    # Login codes one e-mail address, and one client address, may ask for per hour (429 RATE_LIMITED after that). The dev profile raises both.
    otp-per-email-hour: ${OTP_PER_EMAIL_HOUR:5}
    otp-per-ip-hour: ${OTP_PER_IP_HOUR:20}
    # Header carrying the real client IP when behind a trusted proxy, e.g. CF-Connecting-IP. Empty = use the socket address.
    client-ip-header: ${CLIENT_IP_HEADER:}
  cors:
    # Comma separated origin patterns allowed to call the API from a browser (Flutter web). Empty = none.
    allowed-origin-patterns: ${CORS_ORIGINS:}
  bootstrap-admin-email: ${ADMIN_EMAIL:}
  images-dir: ${IMAGES_DIR:./data/images}
  delivery:
    # Delivery is free for now. An admin-editable rule comes later; until then set DELIVERY_FEE_PAISE (4000 = Rs 40).
    fee-paise: ${DELIVERY_FEE_PAISE:0}
    free-above-paise: 49900
  payment:
    online-provider: razorpay
    online-timeout-minutes: 15
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpay-base-url: https://api.razorpay.com
